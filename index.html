<style>
:root{
  /* Layout idea: you walk forward into the screen. A CSS 3D scene (one perspective, one vanishing point on the horizon) holds a winding
     path built from short ground segments, with hills standing on both sides as flat panels at different depths. Scrolling moves the
     camera along the route and turns it with the bends. Cards and project windows stand beside the path and grow as you reach them.
     A plain page shows everything at once. */
  --ink:#14213d;
  --paper:#f2f5f3;
  --card:#ffffff;
  --moss:#2f6f5e;
  --amber:#f2a03d;
  --amberDeep:#a85f14;
  --line:rgba(20,33,61,.14);
  --display:"Instrument Serif",Georgia,serif;
  --body:"Geist",system-ui,sans-serif;
  --mono:"Geist Mono",ui-monospace,monospace;
  --hy:336px;
  --u:1;
  --glow:.6;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font:400 16px/1.55 var(--body);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--display);font-weight:400;text-wrap:balance;margin:0}
h1 em{font-style:italic;color:var(--amberDeep)}
p{margin:0}
a{color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px;border-radius:6px;box-shadow:0 0 0 3px var(--amber)}
.sr{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.nogl{position:relative;z-index:1;max-width:1080px;margin:0 auto;padding:0 22px 18px;font:500 12px/1.4 var(--mono);letter-spacing:.04em;color:#5b6a8c}

/* top bar */
.bar{position:fixed;z-index:50;top:12px;left:12px;right:12px;height:46px;padding:0 6px 0 20px;display:flex;align-items:center;gap:18px;border-radius:999px;background:rgba(255,255,255,.86);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid var(--line);box-shadow:0 8px 28px rgba(20,33,61,.1)}
.mark{font:400 25px/1 var(--display);letter-spacing:-.01em}
.bar .mode{margin-left:auto}
.bar nav{margin-left:8px}
.bar nav{display:flex;align-items:center;gap:18px}
.bar nav a,.navlink{font:500 13px/1 var(--body);text-decoration:none;color:#3a4a6c;transition:color .2s}
.navlink{background:none;border:0;padding:6px 0;cursor:pointer;color:var(--ink)}
.bar nav a:hover,.navlink:hover{color:var(--ink);text-decoration:underline;text-decoration-color:var(--amber);text-underline-offset:5px;text-decoration-thickness:2px}
.bar .sep{width:1px;height:16px;background:var(--line)}
#barSocials{display:flex;gap:18px}
.mode{font:500 13px/1 var(--body);height:34px;padding:0 16px;border-radius:999px;border:0;background:var(--ink);color:#fff;cursor:pointer;transition:background .2s,color .2s}
.mode:hover{background:var(--amber);color:var(--ink)}

/* the walk */
#scroller{position:relative}
#stage{position:sticky;top:0;width:100%;height:100vh;overflow:hidden;--gt:#6f9b7e;--gb:#3f8467;--gb2:#2a6350;--sand:#e8dab5;--r1:#9bb2d6;--r2:#6f8fb8;--r3:#3f8a6d;--r4:#1d5645;--r1t:#cdd9ea;--r2t:#a9bedb;--r3t:#7fb89f;--r4t:#4f8c78}
.sky{position:absolute;inset:0}
#ghost{position:absolute;left:0;white-space:nowrap;font:italic 400 clamp(110px,24vh,240px)/1 var(--display);color:transparent;-webkit-text-stroke:1.5px rgba(255,255,255,.7);letter-spacing:-.01em;pointer-events:none;will-change:transform}
#hGlow{position:absolute;left:50%;top:var(--hy);width:1500px;height:760px;margin:-380px 0 0 -750px;border-radius:50%;pointer-events:none}
.sun{position:absolute;left:0;top:0;width:84px;height:84px;border-radius:50%;background:#ffe2a0;will-change:transform,opacity}
#tilt{position:absolute;inset:0;will-change:transform}
#ground{position:absolute;left:0;right:0;top:var(--hy);height:calc(100% + 700px);background:linear-gradient(var(--gt),var(--gb) 38%,var(--gb2) 100%)}
#viewport,#viewport2{position:absolute;inset:0;perspective:800px;pointer-events:none}
#viewport2{pointer-events:none}
#scene,#scene2{position:absolute;left:50%;top:var(--hy);width:0;height:0;transform-style:preserve-3d}
#world,#world2{position:absolute;left:0;top:0;width:0;height:0;transform-style:preserve-3d;transform-origin:0 0 800px}

.pseg{position:absolute;transform-origin:50% 0;background:var(--sand);border-left:5px solid rgba(255,255,255,.45);border-right:5px solid rgba(255,255,255,.45);display:none}
.pseg i{position:absolute;left:50%;top:0;bottom:0;width:7px;margin-left:-3.5px;background:repeating-linear-gradient(to bottom,var(--amber) 0 20px,transparent 20px 40px);box-shadow:0 0 10px rgba(242,160,61,.7)}
.post{position:absolute;width:8px;height:58px;left:-4px;top:-58px;background:#26334f;border-radius:3px 3px 0 0;display:none}
.post::before{content:"";position:absolute;left:-2px;top:-8px;width:12px;height:12px;border-radius:50%;background:var(--amber);box-shadow:0 0 12px rgba(242,160,61,.9)}
.hill{position:absolute;border-radius:50% 50% 0 0 / 100% 100% 0 0;display:none}
.hill::after{content:"";position:absolute;left:8%;right:40%;top:14%;bottom:0;border-radius:50% 50% 0 0 / 100% 100% 0 0;background:rgba(255,255,255,.13)}
.hill.f::after{left:40%;right:8%}
.c1{background:linear-gradient(to top,var(--r1),var(--r1t))}
.c2{background:linear-gradient(to top,var(--r2),var(--r2t))}
.c3{background:linear-gradient(to top,var(--r3),var(--r3t))}
.c4{background:linear-gradient(to top,var(--r4),var(--r4t))}

.stop{position:absolute;left:0;top:0;width:0;height:0;visibility:hidden;opacity:0}
.stopIn{position:absolute;left:0;bottom:0;transform:translateX(-50%) scale(var(--u));transform-origin:50% 100%;width:max-content;pointer-events:none}
.stop.near .stopIn{pointer-events:auto}
#birds{pointer-events:none}
.floaty{animation:float 7s ease-in-out infinite alternate}
.card{width:340px;padding:20px 22px 22px;border-radius:16px;background:rgba(255,255,255,.96);border:1px solid rgba(255,255,255,.8);box-shadow:0 18px 50px rgba(20,33,61,.25);color:var(--ink)}
.card.hero{width:430px}
.card h1{font-size:58px;line-height:.98;letter-spacing:-.015em;margin:6px 0 10px}
.card h2{font-size:32px;line-height:1.04;letter-spacing:-.01em;margin:6px 0 10px}
.card p{font-size:14.5px;color:#3a4a6c}
.card p+p{margin-top:8px}
.card strong{color:var(--ink);font-weight:500}
.eyebrow{font:500 11px/1.2 var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--amberDeep)}
.route{margin:14px 0 0;padding:0;list-style:none;border-top:1px solid var(--line)}
.route li{display:grid;grid-template-columns:88px 1fr;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13.5px;color:#3a4a6c}
.route b{font:500 11px/1.7 var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--ink)}
.find{margin-top:14px}
.find .eyebrow{display:block;margin-bottom:8px;color:#5b6a8c}
.hint{margin-top:14px!important;font:500 11px/1 var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--ink)!important}
.hint span{display:inline-block;animation:nudge 1.8s ease-in-out infinite}
.link{display:inline-block;margin-top:12px;font-weight:500;font-size:14px;text-decoration:none;color:var(--ink);border-bottom:2px solid var(--amber);padding-bottom:1px}
.link:hover{background:rgba(242,160,61,.25)}
.list{list-style:none;margin:6px 0 0;padding:0}
.list li{position:relative}
.list li::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--amber);transform:scaleX(0);transform-origin:left;transition:transform .8s cubic-bezier(.2,.7,.2,1) calc(var(--k)*.18s + .2s)}
.stop.on .list li::after{transform:scaleX(1)}
.list a{display:flex;justify-content:space-between;gap:10px;padding:11px 0;text-decoration:none;font-weight:500;font-size:14.5px}
.list a span{font:400 11px/1.9 var(--mono);color:#5b6a8c}
.list a:hover{color:var(--moss)}
.pills{display:flex;flex-wrap:wrap;gap:7px}
.pills a{padding:7px 13px;border-radius:999px;border:1px solid rgba(20,33,61,.32);text-decoration:none;font-weight:500;font-size:13px;color:var(--ink);transition:background .2s,border-color .2s}
.pills a:hover{background:var(--amber);border-color:var(--amber)}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.btn{font:500 13px/1 var(--body);height:34px;padding:0 15px;border-radius:999px;border:1px solid rgba(20,33,61,.4);background:transparent;color:var(--ink);cursor:pointer;transition:background .2s,color .2s,border-color .2s}
.btn.solid{background:var(--ink);border-color:var(--ink);color:#fff}
.btn:hover{background:var(--amber);border-color:var(--amber);color:var(--ink)}

.card>*,.wbody>*{opacity:0;transform:translateY(10px);transition:opacity .5s,transform .5s}
.stop.on .card>*,.stop.on .wbody>*{opacity:1;transform:none}
.stop.on .card>*:nth-child(2),.stop.on .wbody>*:nth-child(2){transition-delay:.1s}
.stop.on .card>*:nth-child(3),.stop.on .wbody>*:nth-child(3){transition-delay:.18s}
.stop.on .card>*:nth-child(4),.stop.on .wbody>*:nth-child(4){transition-delay:.26s}
.stop.on .card>*:nth-child(5),.stop.on .wbody>*:nth-child(5){transition-delay:.34s}
.stop.on .card>*:nth-child(6){transition-delay:.42s}

.win{width:380px;border-radius:16px;background:#fff;overflow:hidden;box-shadow:0 26px 70px rgba(20,33,61,.32);border:1px solid rgba(255,255,255,.8)}
.wbar{display:flex;align-items:center;gap:6px;height:34px;padding:0 12px;background:#eef1f6}
.wbar i{width:9px;height:9px;border-radius:50%;background:#e7b6a8}
.wbar i:nth-child(2){background:#ecd49a}
.wbar i:nth-child(3){background:#aed3b4}
.wbar b{margin-left:10px;flex:1;height:20px;padding:0 10px;border-radius:999px;background:#fff;font:500 11px/20px var(--mono);color:#6b7898;overflow:hidden;white-space:nowrap}
.wscreen{position:relative;height:150px;overflow:hidden}
.wscreen svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.wbody{padding:14px 18px 18px}
.wbody h2{font-size:30px;line-height:1.04;letter-spacing:-.01em;margin:6px 0}
.wbody p{font-size:14px;color:#3a4a6c}

.else{display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center;width:300px}
.else .head{padding:14px 22px 16px;border-radius:16px;background:rgba(255,255,255,.96);box-shadow:0 18px 50px rgba(20,33,61,.25)}
.else h2{font-size:32px;line-height:1.04;margin-top:6px}
.orbitbox{position:relative;width:160px;height:160px;margin-bottom:12px}
.ringsvg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.ringsvg circle{fill:none;stroke:var(--amber);stroke-width:2;stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset 1.3s cubic-bezier(.2,.7,.2,1)}
.stop.on .ringsvg circle{stroke-dashoffset:0}
.orbit{position:absolute;inset:0;animation:spin 32s linear infinite}
.sl{position:absolute;left:50%;top:50%;width:0;height:0;transform:rotate(var(--a)) translateX(74px)}
.un{transform:rotate(calc(-1*var(--a)))}
.sp{animation:spin 32s linear infinite reverse}
.sp a{display:block;transform:translate(-50%,-50%);white-space:nowrap;padding:7px 13px;border-radius:999px;background:#fff;box-shadow:0 8px 24px rgba(20,33,61,.22);text-decoration:none;font-weight:500;font-size:13px;color:var(--ink);transition:background .2s}
.sp a:hover{background:var(--amber)}

.aboutTop{display:flex;align-items:center;gap:14px;margin-bottom:8px}
.aboutHead h2{margin:4px 0 0!important;font-size:28px!important}
.photo{flex:none;width:76px;height:76px;border-radius:50%;overflow:hidden;display:grid;place-items:center;text-align:center;border:2px dashed rgba(242,160,61,.95);background:linear-gradient(160deg,#cfe6f1,#fbe3c4);font:500 9.5px/1.2 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:#6b7898}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.photo.has{border:2px solid #fff;box-shadow:0 6px 18px rgba(20,33,61,.2)}
.allhero .photo{width:108px;height:108px;margin-bottom:18px;font-size:10.5px}

/* birds */
#birds{position:absolute;left:0;top:0;width:0;height:0;visibility:hidden}
.birdsIn{position:absolute;left:0;top:0;transform:translateX(-50%);animation:hoverB 2.6s ease-in-out infinite;transform-origin:50% 0}
.birdsIn svg{display:block;width:100%;height:auto;overflow:visible}
.wing{transform-box:fill-box;transform-origin:10% 90%;animation:flap .34s ease-in-out infinite alternate}
.bird2 .wing{animation-delay:-.12s}

/* screen-space pieces */
#lantern{position:absolute;z-index:4;left:50%;width:0;height:0;will-change:transform,opacity}
.orb{position:absolute;left:-10px;top:-13px;width:20px;height:26px;border-radius:50% 50% 46% 46%;background:radial-gradient(circle at 50% 40%,#fff8dc,#f2a03d 75%);box-shadow:0 0 calc(40px*var(--glow)) calc(10px*var(--glow)) rgba(242,160,61,.65);animation:bob 2.8s ease-in-out infinite}
.orb::before{content:"";position:absolute;left:4px;top:-8px;width:12px;height:8px;border:1.5px solid #3a3a4a;border-bottom:0;border-radius:8px 8px 0 0}
#lglow{position:absolute;z-index:3;left:50%;width:520px;height:300px;margin-left:-260px;border-radius:50%;background:radial-gradient(closest-side,rgba(255,214,140,.5),rgba(255,214,140,0));pointer-events:none}
#sunF{z-index:3}
#chip{position:absolute;z-index:6;left:50%;bottom:14px;transform:translateX(-50%);white-space:nowrap;padding:7px 14px;border-radius:999px;background:rgba(255,255,255,.9);font:500 11.5px/1 var(--mono);letter-spacing:.06em}
#progress{position:absolute;z-index:6;left:0;right:0;bottom:0;height:3px;background:rgba(0,0,0,.2)}
#progress i{display:block;height:100%;width:0;background:var(--amber)}

@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes float{from{transform:translateY(0) rotate(-.6deg)}to{transform:translateY(-7px) rotate(.6deg)}}
@keyframes nudge{0%,100%{transform:translateY(0)}50%{transform:translateY(4px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes flap{from{transform:rotate(-24deg)}to{transform:rotate(16deg)}}
@keyframes hoverB{0%,100%{transform:translateX(-50%) translateY(0) rotate(-1.2deg)}50%{transform:translateX(-50%) translateY(-6px) rotate(1.2deg)}}

/* everything view */
.wrap{max-width:1080px;margin:0 auto;padding:0 22px}
.allhero{position:relative;padding-top:112px;background:linear-gradient(#f6b8a3,#fde8c9 62%,#fff4de);overflow:hidden}
.allhero .wrap{position:relative;z-index:1;display:grid;grid-template-columns:1.15fr 1fr;gap:48px;align-items:end;padding-bottom:200px}
.allhero .eyebrow{color:var(--amberDeep)}
.allhero h1{font-size:clamp(60px,10vw,120px);line-height:.88;letter-spacing:-.025em;margin:12px 0 18px}
.allhero .tag{font-size:18px;max-width:32ch;color:#2c3a5c}
.allhero .pills{margin-top:22px}
.allhero .bio p{font-size:17px;max-width:46ch;color:#26334f}
.allhero .bio p+p{margin-top:12px}
.hills{position:absolute;left:0;right:0;bottom:-1px;width:100%;height:210px;display:block}
.sec{padding-top:64px}
.sh{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;font-size:clamp(34px,4.6vw,52px);line-height:1;letter-spacing:-.015em;margin-bottom:26px}
.sh small{font:500 11px/1 var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--moss)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:20px}
.pcard{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;transition:transform .25s,box-shadow .25s}
.pcard:hover{transform:translateY(-4px);box-shadow:0 18px 40px rgba(20,33,61,.14)}
.thumb{position:relative;height:190px;overflow:hidden}
.thumb svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.thumb span{position:absolute;z-index:2;left:14px;top:14px;padding:5px 9px;border-radius:999px;background:rgba(255,255,255,.88);font:500 10.5px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink)}
.pbody{padding:18px 20px 22px}
.pbody h3{font-size:28px;line-height:1.05;letter-spacing:-.01em;margin-bottom:8px}
.pbody p{font-size:15px;color:#3a4a6c}
.rows{list-style:none;margin:0;padding:0;border-bottom:1px solid var(--line)}
.rows a{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding:22px 4px;border-top:1px solid var(--line);text-decoration:none;font:400 clamp(24px,3.4vw,36px)/1.1 var(--display);letter-spacing:-.01em;transition:padding .25s,color .25s}
.rows a span{font:500 11px/1 var(--mono);letter-spacing:.07em;text-transform:uppercase;color:#5b6a8c;white-space:nowrap}
.rows a:hover{padding-left:14px;color:var(--moss)}
.end{margin-top:84px;padding:52px 22px 60px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;background:#1b2440;color:#eef0f7}
.end .dot{width:12px;height:12px;border-radius:50%;border:2px solid var(--amber);box-shadow:0 0 0 8px rgba(242,160,61,.2);margin-bottom:12px}
.end h2{font-size:38px;letter-spacing:-.01em}
.end p{color:#b9c0d8}
.end .btn{margin-top:12px;border-color:rgba(255,255,255,.5);color:#fff}
.end .btn:hover{background:var(--amber);border-color:var(--amber);color:var(--ink)}

@media (max-width:860px){ #barSocials,.bar .sep{display:none} }
@media (max-width:760px){
  .allhero .wrap{grid-template-columns:1fr;gap:26px;padding-bottom:170px}
  .mode{padding:0 13px}
}
@media (max-width:520px){ .bar{padding-left:16px;gap:10px} .bar nav{gap:12px} .mark{font-size:23px} }
@media (prefers-reduced-motion:reduce){
  .orb,.floaty,.orbit,.sp,.hint span,.birdsIn,.wing{animation:none}
  .card>*,.wbody>*,.list li::after,.ringsvg circle{transition:none}
}

/* terrain build */
#gl{position:absolute;z-index:1;inset:0;width:100%;height:100%;display:block}
#stops{position:absolute;z-index:2;inset:0;pointer-events:none}
.stop{width:max-content;height:auto;left:0;top:0;transform-origin:50% 50%;will-change:transform,opacity}
.stopIn{position:relative;left:auto;bottom:auto;transform:none}
.withBirds{position:relative}
.birdsWrap{position:absolute;left:50%;bottom:100%;width:340px;margin:0 0 4px -170px;opacity:0;transform:translateX(-120vw);transition:transform 1.8s cubic-bezier(.2,.7,.2,1),opacity .7s;pointer-events:none}
.stop.on .birdsWrap{opacity:1;transform:none}
.birdsIn{position:relative;left:auto;top:auto;animation:hoverC 2.6s ease-in-out infinite}
.birdsIn svg{display:block;width:100%;height:auto;overflow:visible}
@keyframes hoverC{0%,100%{transform:translateY(0) rotate(-1.2deg)}50%{transform:translateY(-6px) rotate(1.2deg)}}
@media (prefers-reduced-motion:reduce){.birdsWrap{transition:none}}
/* trailhead sign */
.sign{position:relative;width:520px;padding-bottom:90px}
.sign::before,.sign::after{content:"";position:absolute;bottom:0;width:26px;height:130px;z-index:-1;border-radius:4px;background:repeating-linear-gradient(90deg,rgba(0,0,0,.14) 0 2px,transparent 2px 7px),linear-gradient(#8a5a30,#5e3a1c);box-shadow:0 10px 24px rgba(0,0,0,.35)}
.sign::before{left:12%}.sign::after{right:12%}
.signBoard{position:relative;padding:20px 24px;border-radius:16px;border:7px solid #5e3a1c;color:#fbe9c8;
  background:repeating-linear-gradient(176deg,rgba(0,0,0,.07) 0 2px,transparent 2px 11px),repeating-linear-gradient(88deg,rgba(255,255,255,.05) 0 1px,transparent 1px 23px),linear-gradient(#b9814b,#9a6334 55%,#a96f3c);

.signBoard h1 em{color:#ffd78a}
.stag{font-size:14.5px;color:#fbe9c8;max-width:46ch}

.mapBox svg{display:block;width:100%;height:auto}

.signBoard>*{opacity:0;transform:translateY(10px);transition:opacity .5s,transform .5s}

#lantern,#lglow,#sunF{display:none!important}

.sign{padding-bottom:84px}
.sign::before,.sign::after{bottom:-6px;height:100px;z-index:-1}
.signGround{position:absolute;left:-2%;right:-2%;bottom:-30px;width:104%;height:auto;pointer-events:none;z-index:-2}

.signGrass{position:absolute;left:-2%;width:104%;height:auto;bottom:-30px;z-index:2;pointer-events:none}

/* legibility: light text on the pale top of the wood grain, and small labels on tinted backgrounds */
.signBoard .eyebrow,.stag,.signBoard .hint{text-shadow:0 1px 2px rgba(60,28,8,.75),0 0 8px rgba(60,28,8,.35)}

/* stops stay in the accessibility tree (so links can be tabbed to and read) and are only faded out visually */
.stop{visibility:visible}

/* reduced motion: keep the walk, drop the flutter, bobbing, spinning and long transitions */
@media (prefers-reduced-motion:reduce){

}

/* the pink bug you chase down the path */
#bug{position:absolute;z-index:2;left:0;top:0;width:0;height:0;pointer-events:none;will-change:transform}
.bugIn{position:absolute;left:-60px;top:-100px;width:120px;height:110px;transform-origin:60px 100px}
.bugIn>svg{display:block;width:120px;height:110px;overflow:visible;transform-origin:60px 100px;animation:bugIdle 2.4s ease-in-out infinite}
#bug.run .bugIn>svg{animation:bugRun .2s ease-in-out infinite alternate}
.leg{transform-box:fill-box}
.legL{transform-origin:100% 0}
.legR{transform-origin:0 0}
#bug.run .l1,#bug.run .r2,#bug.run .l3{animation:legA .2s ease-in-out infinite alternate}
#bug.run .r1,#bug.run .l2,#bug.run .r3{animation:legA .2s ease-in-out infinite alternate-reverse}
.bFront{opacity:0;transition:opacity .45s}
.bBack{transition:opacity .45s}
#bug.caught .bFront{opacity:1}
#bug.caught .bBack{opacity:0}
.bugSay{position:absolute;left:50%;bottom:calc(100% + 40px);width:max-content;transform:translateX(-50%) scale(.6);opacity:0;white-space:nowrap;padding:9px 18px 10px;border-radius:999px;background:#fff;border:2px solid #ff8fc4;box-shadow:0 12px 34px rgba(20,33,61,.28);font:400 26px/1 var(--display);color:var(--ink);transition:opacity .5s,transform .6s cubic-bezier(.2,.9,.3,1.4)}
.bugSay::after{content:"";position:absolute;left:50%;top:100%;width:12px;height:12px;margin:-6px 0 0 -6px;background:#fff;border-right:2px solid #ff8fc4;border-bottom:2px solid #ff8fc4;transform:rotate(45deg)}
#bug.caught .bugSay{opacity:1;transform:translateX(-50%) scale(1)}
.hearts{position:absolute;left:60px;top:62px;width:0;height:0;opacity:0;transition:opacity .4s}
#bug.caught .hearts{opacity:1}
.hearts i{position:absolute;left:-9px;top:-8px;width:18px;height:16px;opacity:0}
.hearts svg{display:block;width:100%;height:100%;fill:#ff5fa2;transform:rotate(calc(-1*var(--a)))}
#bug.caught .hearts i{animation:heartOut 2.3s ease-out infinite;animation-delay:var(--d)}
@keyframes heartOut{0%{transform:rotate(var(--a)) translateY(-14px) scale(.35);opacity:0}15%{opacity:1}100%{transform:rotate(var(--a)) translateY(-92px) scale(1.05);opacity:0}}
@keyframes bugIdle{0%,100%{transform:translateY(0) scaleY(1)}50%{transform:translateY(-1px) scaleY(1.03)}}
@keyframes bugRun{from{transform:translateY(0) rotate(-3deg)}to{transform:translateY(-4px) rotate(3deg)}}
@keyframes legA{from{transform:rotate(-16deg)}to{transform:rotate(16deg)}}
@media (prefers-reduced-motion:reduce){
  .bugIn>svg,#bug.run .bugIn>svg,#bug.run .leg{animation:none!important}
  #bug.caught .hearts i{animation:none!important;opacity:1;transform:rotate(var(--a)) translateY(-64px) scale(.9)}
  .bugSay,.bFront,.bBack{transition:none!important}
}

const fr = x => x - Math.floor(x);

function ridgePath(W,h,seed,base,amp,k){
  let d = `M0 ${h}`;
  for(let x=0;x<=W+10;x+=8){
    const y = h*(base - amp*(.5*Math.sin(x/(340*k)+seed) + .3*Math.sin(x/(140*k)+seed*1.7) + .2*Math.sin(x/(61*k)+seed*2.3)));
    d += `L${x} ${y.toFixed(1)}`;
  }
  return d + `L${W+10} ${h}Z`;
}
const hex = h => [1,3,5].map(i => parseInt(h.slice(i,i+2),16));
const mix = (a,b,t) => { const A=hex(a), B=hex(b); return "#" + A.map((v,i)=>Math.round(v+(B[i]-v)*t).toString(16).padStart(2,"0")).join(""); };
const clamp = (v,a,b) => Math.min(b,Math.max(a,v));

const smooth = (a,b,v) => { const t = clamp((v-a)/(b-a),0,1); return t*t*(3-2*t); };
const ease5 = t => t*t*t*(t*(t*6-15)+10);

/* five skies; each arrives as a circle growing out of the lantern */
function buildPal(top,bot,n,glow){

    r2: mix(mix(bot,"#6f8fb8",.55),"#242a5e",n*.8),

    gnd: mix("#3f8467","#14243c",n),
    gnd2: mix("#2a6350","#0c182a",n),
    sand: mix("#e8dab5","#6a6890",n)
  };
}
const PALS = [
  buildPal("#f6b8a3","#fde8c9",0,"#ffd9b0"),
  buildPal("#5fb4ea","#d8f0f7",0,"#ffffff"),
  buildPal("#f59f5b","#fbd78f",0,"#ffc060"),

  buildPal("#121a3c","#3a2f6b",1,"#7b64c8")
];

const mixPal = (a,b,t) => { const o={}; for(const k in a) o[k]=mix(a[k],b[k],t); return o; };

const trailEl=$("#trail"), allEl=$("#all"), scroller=$("#scroller"), stage=$("#stage"), chip=$("#chip"), prog=$("#progress i"), btn=$("#modeBtn");

const RM = window.matchMedia ? window.matchMedia("(prefers-reduced-motion: reduce)") : {matches:false};
const scrollBehavior = () => RM.matches ? "auto" : "smooth";
/* low-end devices get fewer trees and a lower pixel ratio; the look stays the same */
const LOW = (navigator.hardwareConcurrency||8) <= 4 || (navigator.deviceMemory||8) <= 3;
/* WebGL check up front, so browsers without it land on the plain page instead of a blank stage */
let noGL = !(()=>{ try{ const c=document.createElement("canvas"); return !!(T3 && window.WebGLRenderingContext && (c.getContext("webgl2")||c.getContext("webgl"))); }catch(e){ return false; } })();

const GAP = 60;           /* world units between stops */
const D0 = 16;            /* a card is at natural size this far ahead of the camera */
const SEND = (N-1)*GAP + 260;
const CAMY = 1.8, PITCH = 0.092;
const pathX  = s => 14*Math.sin(s/38) + 5*Math.sin(s/17+1);
const pathDX = s => 14/38*Math.cos(s/38) + 5/17*Math.cos(s/17+1);

let mode=null, vw=0, H=0, U=1, HY=336, segScroll=480, scrollerH=0;

/* ----- terrain ----- */
const vnoise=(x,y)=>{const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,h=(a,b)=>fr(Math.sin(a*127.1+b*311.7)*43758.5453),u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);return lerp(lerp(h(xi,yi),h(xi+1,yi),u),lerp(h(xi,yi+1),h(xi+1,yi+1),u),v);};
const fbm=(x,y)=>.55*vnoise(x,y)+.3*vnoise(x*2.1+7,y*2.1+3)+.15*vnoise(x*4.3+1,y*4.3+9);
function terrainH(xr,s){
  const xw = xr + pathX(s), d = Math.abs(xr);
  const edge = smooth(7,34,d), amp = 10 + 30*smooth(25,110,d);
  return edge*amp*(.25 + .9*fbm(xw*.045, s*.045));
}

const VERT = `attribute float aH; varying vec3 vN; varying float vH; varying float vD;
void main(){ mat4 m = modelMatrix;
#ifdef USE_INSTANCING
 m = m*instanceMatrix;
#endif
 vec4 wp = m*vec4(position,1.0); vN = normalize(mat3(m)*normal); vH = aH;
 vec4 mv = viewMatrix*wp; vD = -mv.z; gl_Position = projectionMatrix*mv; }`;
const FRAG = `uniform vec3 uLow,uHigh,uSunDir,uSunCol,uAmb,uFog; uniform float uNear,uFar;
varying vec3 vN; varying float vH; varying float vD;
void main(){ vec3 n = normalize(vN);
 float wrap = max(dot(n,uSunDir),0.0)*.75 + .25*max(n.y,0.0);
 vec3 base = mix(uLow,uHigh,clamp(vH,0.0,1.0));
 vec3 col = base*(uAmb + uSunCol*wrap);
 col = mix(min(col,vec3(1.0)),uFog,smoothstep(uNear,uFar,vD));
 gl_FragColor = vec4(col,1.0); }`;

function initGL(){
  renderer = new T3.WebGLRenderer({canvas:glCanvas, antialias:true, alpha:true});
  renderer.setClearColor(0x000000,0);
  scene = new T3.Scene();
  camera = new T3.PerspectiveCamera(60,1,.3,420);
  const sh = {
    sunDir:{value:new T3.Vector3(-.45,.6,.65).normalize()}, sunCol:{value:new T3.Color()}, amb:{value:new T3.Color()},
    fog:{value:new T3.Color()}, near:{value:30}, far:{value:200}
  };
  const mat = (lo,hi,extra={}) => new T3.ShaderMaterial({
    vertexShader:VERT, fragmentShader:FRAG, polygonOffset:!!extra.po, polygonOffsetFactor:-2, polygonOffsetUnits:-2,
    uniforms:{uLow:{value:new T3.Color(lo)}, uHigh:{value:new T3.Color(hi)}, uSunDir:sh.sunDir, uSunCol:sh.sunCol, uAmb:sh.amb, uFog:sh.fog, uNear:sh.near, uFar:sh.far}
  });
  G = {sh, ground:mat("#3f8467","#7fb89f"), path:mat("#e8dab5","#e8dab5",{po:1}), tree:mat("#1d5645","#3f8a6d")};

  /* ground and path, built as a grid that follows the route so hills run along both sides */
  const STEP=3, XR=120, S0=-48;
  const gp=[], gh=[], pp=[], ph=[];
  let n=0;
  for(let s=S0;s<SEND;s+=STEP){
    for(let xr=-XR;xr<XR;xr+=STEP){
      const q=[[xr,s],[xr+STEP,s],[xr+STEP,s+STEP],[xr,s+STEP]].map(([a,b])=>[pathX(b)+a,terrainH(a,b),-b]);
      const tris = (n++%2) ? [[0,1,2],[0,2,3]] : [[0,1,3],[1,2,3]];
      const isPath = xr>=-3 && xr+STEP<=3;
      tris.forEach(t=>{
        const avg=(q[t[0]][1]+q[t[1]][1]+q[t[2]][1])/3;
        const k = clamp(avg/34 + (rnd(n*3+t[0])-.5)*.14, 0, 1);
        t.forEach(i=>{ gp.push(q[i][0],q[i][1],q[i][2]); gh.push(k); });
      });
    }
  }
  const mk=(pos,h)=>{ const g=new T3.BufferGeometry(); g.setAttribute("position",new T3.Float32BufferAttribute(pos,3)); g.setAttribute("aH",new T3.Float32BufferAttribute(h,1)); g.computeVertexNormals(); return g; };
  const gm=new T3.Mesh(mk(gp,gh),G.ground); gm.frustumCulled=false; scene.add(gm);
  for(let s=S0;s<SEND;s+=1.5){
    const s2=s+1.5, W=.95;
    const a=[pathX(s)-W,.04,-s], b=[pathX(s)+W,.04,-s], c=[pathX(s2)+W,.04,-s2], d=[pathX(s2)-W,.04,-s2];
    [a,b,c,a,c,d].forEach(v=>{ pp.push(v[0],v[1],v[2]); ph.push(.5); });
  }
  const pm=new T3.Mesh(mk(pp,ph),G.path); pm.frustumCulled=false; scene.add(pm);

  /* low-poly trees on the slopes */
  const cone=new T3.ConeGeometry(1,3.4,5).toNonIndexed(); cone.translate(0,1.7,0); cone.computeVertexNormals();
  const ah=[]; const cp=cone.attributes.position; for(let i=0;i<cp.count;i++) ah.push(cp.getY(i)/3.4);
  cone.setAttribute("aH",new T3.Float32BufferAttribute(ah,1));
  const TN=LOW?520:900, trees=new T3.InstancedMesh(cone,G.tree,TN), M=new T3.Matrix4(), Q=new T3.Quaternion(), E=new T3.Euler();
  let placed=0;
  for(let k=0;placed<TN && k<4000;k++){
    const s=rnd(k*5+1)*(SEND-60)-20, side=rnd(k*5+2)>.5?1:-1, xr=side*(11+rnd(k*5+3)*85), h=terrainH(xr,s);
    if(h>20) continue;
    const sc=.55+rnd(k*5+4)*1.1;
    E.set(0,rnd(k*7)*6.28,0); Q.setFromEuler(E);
    M.compose(new T3.Vector3(pathX(s)+xr,h-.1,-s),Q,new T3.Vector3(sc,sc*(1+rnd(k*3)*.7),sc));
    trees.setMatrixAt(placed++,M);
  }
  trees.count=placed; trees.frustumCulled=false; scene.add(trees);

  /* lamp posts and the amber dashes down the middle */
  scene.fog = new T3.Fog(0xffffff,30,200);
  const dashG=new T3.BoxGeometry(.28,.02,1.5);
  G.fogObj = scene.fog;
  built = true;
}

/* natural (unscaled) heights of the stops, so the sign can be fitted under the top bar on short screens */
let barB = 58;
function measure(){
  barB = document.querySelector(".bar").getBoundingClientRect().bottom;
  stopEls.forEach((el,i)=>{ if(stopMeta[i]) stopMeta[i].hN = el.offsetHeight; });
}

function layout(){
  vw = window.innerWidth; H = window.innerHeight;
  U = clamp(H/800,.7,1.1);
  HY = Math.round(H*.42);
  segScroll = Math.round(clamp(H*.62,380,560));
  scrollerH = H + (N-1)*segScroll;
  scroller.style.height = scrollerH+"px";
  stage.style.height = H+"px";
  stage.style.setProperty("--hy", HY+"px");
  skies.forEach((el,i)=>{ el.style.background = `linear-gradient(${PALS[i].top},${PALS[i].bot})`; });

  const narrow = vw < 760;
  stopMeta = Array.from({length:N},(_,i)=>({d0:i===0?6.5:D0, s:i*GAP+(i===0?6.5:D0), u:Math.min(U,(vw-24)/WIDTHS[i]), side:narrow?0:(i%2?1:-1), off:[3.9,5.2,6.5,6.5,6.5,6.5,6.5,6.5][i], ay:i===0?0:2.5, bottom:i===0}));
  stopsEl.innerHTML = stopMeta.map((m,i)=>{
    let inner;
    if(i>=2 && i<=4) inner = winHTML(i, SITE.projects[i-2]);
    else if(i===6) inner = elsewhereHTML();
    else if(i===0) inner = signHTML();
    else inner = `<article class="card">${cardHTML(i)}</article>`;
    return `<section class="stop" id="stop-${i}" data-i="${i}" aria-label="Stop ${i+1} of ${N}: ${NAMES[i]}"><div class="stopIn"><div class="floaty" style="${i===0?"animation:none":`animation-delay:-${(i*1.3).toFixed(1)}s`}">${inner}</div></div></section>`;
  }).join("");
  stopEls = [...stopsEl.querySelectorAll(".stop")];
  measure();

  if(!built){
    try{ initGL(); }
    catch(e){ console.warn("WebGL failed to start, showing the plain page", e); glFail(); return; }
  }
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, LOW?1.5:2));
  renderer.setSize(vw,H,false);
  camera.aspect = vw/H; camera.updateProjectionMatrix();
  lastChip = "";
  update();
}

/* scroll position to distance along the route, lingering at every stop */
function camDist(p){
  const seg = N-1, x = p*seg, k = Math.min(seg-1, Math.floor(x)), t = x-k;
  return (k + ease5(clamp((t-.1)/.8,0,1)))*GAP;
}
const stopY = i => Math.round((i/(N-1))*(scrollerH-H));
const tmpV = () => new T3.Vector3();
let V1 = null;

function render(p){
  const camS = camDist(p);
  const lx = vw/2, ly = Math.round(H*.86);
  const maxR = Math.hypot(Math.max(lx,vw-lx), Math.max(ly,H-ly)) + 24;
  const g = GAP;
  const Tt = [0, smooth(.45*g,.85*g,camS), smooth(1.45*g,1.85*g,camS), smooth(4.45*g,4.85*g,camS), smooth(5.45*g,5.85*g,camS)];
  let pal = PALS[0], ga = GLOW_A[0];
  for(let i=1;i<5;i++){
    skies[i].style.clipPath = `circle(${(Tt[i]*maxR).toFixed(1)}px at ${lx}px ${ly}px)`;
    pal = mixPal(pal, PALS[i], Tt[i]);
    ga = lerp(ga, GLOW_A[i], Tt[i]);
  }
  const [gr,ggn,gbl] = hex(pal.glow);
  hGlow.style.background = `radial-gradient(closest-side,rgba(${gr},${ggn},${gbl},${ga.toFixed(2)}),rgba(${gr},${ggn},${gbl},0))`;
  stage.style.setProperty("--glow", (.55+.6*Tt[4]).toFixed(2));

  /* terrain colours follow the sky */
  const night = Tt[3]*.35 + Tt[4]*.65;
  const fogC = mix(pal.top, pal.bot, clamp(HY/H*1.15,0,1));
  const sh = G.sh;
  sh.fog.value.set(fogC); G.fogObj.color.set(fogC);
  sh.sunCol.value.set(mix(pal.glow,"#ffffff",.5)).multiplyScalar(lerp(.6,.5,night));
  sh.amb.value.set(mix(mix(pal.top,pal.bot,.5),"#ffffff",.45)).multiplyScalar(lerp(.86,.8,night));
  G.ground.uniforms.uLow.value.set(mix(pal.gnd,pal.bot,.18));
  G.ground.uniforms.uHigh.value.set(mix(pal.gnd, mix(pal.r3,pal.bot,.4), .85));
  G.path.uniforms.uLow.value.set(mix(pal.sand,"#b9a276",.35)); G.path.uniforms.uHigh.value.set(mix(pal.sand,"#b9a276",.35));
  G.tree.uniforms.uLow.value.set(mix(pal.r4,pal.r3,.35)); G.tree.uniforms.uHigh.value.set(mix(pal.r3,pal.bot,.3));

  /* camera walks the route, looks ahead and leans into bends */
  const bob = 0;
  camera.position.set(pathX(camS), CAMY+bob, -camS);
  const LA = 14;
  camera.lookAt(pathX(camS+LA), CAMY-LA*PITCH, -(camS+LA));
  camera.updateMatrixWorld(true);
  renderer.render(scene,camera);


  /* the sun: rises behind the hills, then rolls down and becomes the lantern */
  const u = smooth(0, GAP*.8, camS);
  const small = vw < 700;
  const sx0 = small ? vw*.5 : vw*.66, sy0 = small ? HY*.55 : HY - 30;
  const sunCol = mix("#ffe2a0","#ffb347",u);
  const back = 1 - smooth(0,.25,u);
  const v = smooth(.15,1,u);
  const fx = lerp(sx0, lx, v), fy = lerp(sy0, ly, v), fs = lerp((small?110:170)/84, .3, v);
  const setSun = (el,x,y,s,o) => {
    el.style.transform = `translate(${(x-42).toFixed(1)}px,${(y-42).toFixed(1)}px) scale(${s.toFixed(3)})`;
    el.style.background = sunCol; el.style.opacity = o.toFixed(2);
    el.style.boxShadow = `0 0 ${Math.round(lerp(90,40,v))}px ${Math.round(lerp(30,10,v))}px ${sunCol}99`;
  };
  setSun(sunB, sx0, sy0, (small?110:170)/84, back*(1-smooth(.9,1.4,camS/GAP)));
  setSun(sunF, fx, fy, fs, smooth(0,.25,u)*(1-smooth(.8,1,u)));
  lanternEl.style.top = ly+"px";
  lanternEl.style.opacity = smooth(.7,1,u).toFixed(2);
  lglow.style.top = (ly-150)+"px";
  lglow.style.opacity = (smooth(.7,1,u)*.9).toFixed(2);

  /* stops stand beside the path and grow as you reach them */
  if(!V1) V1 = tmpV();
  let best=0, bd=Infinity;
  stopEls.forEach((el,i)=>{
    const m = stopMeta[i];
    V1.set(pathX(m.s)+m.side*m.off, m.ay, -m.s);
    const dist = camera.position.distanceTo(V1);
    V1.project(camera);
    const o0 = V1.z>1 ? 0 : smooth(46,36,dist)*(1-smooth(m.d0-3,m.d0-10,dist));
    const o = o0>.94 ? 1 : o0;
    el.style.opacity = o.toFixed(2);
    el.classList.toggle("near", dist>m.d0-6 && dist<m.d0+9);
    el.classList.toggle("on", dist<42 && dist>m.d0-11);
    if(o>.02){
      let sx=(V1.x*.5+.5)*vw, sy=(-V1.y*.5+.5)*H, sc=m.u*clamp(m.d0/dist,.2,1.25)*(m.bottom?(vw<760?1:.8):1);
      /* the sign stands on the ground; on short screens shrink it a little and lift it so it never hides under the top bar */
      if(m.bottom && m.hN){
        const room = H - barB - 52;
        if(m.hN*sc > room) sc = Math.max(room/m.hN, sc*.72);
        /* scale is about the centre, so the top edge sits at sy - hN*(1+sc)/2 */
        sy = Math.max(sy, barB + 8 + m.hN*(1+sc)/2);
      }
      /* keep cards inside the screen on phones and mid-size windows */
      const half = WIDTHS[i]*sc/2 + 12;
      if(vw > half*2) sx = clamp(sx, half, vw-half);
      el.style.transform = `translate3d(${sx.toFixed(1)}px,${sy.toFixed(1)}px,0) translate(-50%,${m.bottom?-100:-50}%) scale(${sc.toFixed(3)})`;
    }
    const dd = Math.abs(m.s - m.d0 - camS);
    if(dd<bd){ bd=dd; best=i; }
  });

  placeBug(camS);

  const label = `↓ Stop ${best+1} of ${N} · ${NAMES[best]}`;
  if(label!==lastChip){ chip.textContent = label; lastChip = label; }
  prog.style.width = (p*100).toFixed(1)+"%";
}

/* ---------- the bug: always a few steps ahead on the path, until you catch it at the end ---------- */
const bugEl = $("#bug");
const BUG_W = .95;                 /* world units across */
let bugLastS = null;
function placeBug(camS){
  const END = (N-1)*GAP;
  const near = smooth(END - 1.4*GAP, END - 1, camS);      /* closes the gap over the last stretch */
  const lead = lerp(9.5, 4.4, near);
  const bs = camS + lead;
  const wig = .3*Math.sin(bs*.55)*(1-near);                /* scuttles side to side on the path */
  V1.set(pathX(bs) + wig, .04, -bs);
  const dist = camera.position.distanceTo(V1);
  V1.project(camera);
  if(V1.z > 1){ bugEl.style.opacity = "0"; return; }
  let sx = (V1.x*.5+.5)*vw, sy = (-V1.y*.5+.5)*H;
  const px = BUG_W * (H/2) / Math.tan(camera.fov*Math.PI/360) / dist;
  const sc = clamp(px/120, .18, 1.5);
  /* at the finish, keep the bug and its caption clear of the end card */
  const endEl = stopEls[N-1];
  if(near > 0 && endEl && +endEl.style.opacity > .02){
    const r = endEl.getBoundingClientRect(), half = 130*sc + 14, top = 192*sc;
    if(sy - top < r.bottom + 10 && sx + half > r.left && sx - half < r.right){
      if(r.left - half >= half) sx = Math.min(sx, r.left - half);
      else if(vw - r.right >= half*2) sx = Math.max(sx, r.right + half);
      else sy = Math.min(H - 56, Math.max(sy, r.bottom + 10 + top));
    }
  }
  const rot = 9*Math.cos(bs*.55)*(1-near);
  bugEl.style.opacity = "1";
  bugEl.style.transform = `translate3d(${sx.toFixed(1)}px,${sy.toFixed(1)}px,0)`;
  bugEl.firstElementChild.style.transform = `scale(${sc.toFixed(3)}) rotate(${rot.toFixed(1)}deg)`;
  const caught = camS > END - 2;
  bugEl.classList.toggle("caught", caught);
  bugEl.classList.toggle("run", !caught && bugLastS!==null && Math.abs(camS - bugLastS) > .02);
  bugLastS = camS;
}

let curP = 0, running = false;
const targetP = () => { const maxY = scrollerH - H; return maxY>0 ? clamp(window.scrollY/maxY,0,1) : 0; };
function update(){ if(mode!=="trail" || !built) return; curP = targetP(); render(curP); bugEl.classList.remove("run"); }
function frame(){
  running = false;
  if(mode!=="trail") return;
  const tp = targetP(), d = tp - curP;
  curP = Math.abs(d)<.0003 ? tp : curP + d*.16;
  render(curP);
  if(Math.abs(tp-curP)>.0003){ running = true; requestAnimationFrame(frame); }
  else bugEl.classList.remove("run");
}
function onScroll(){ if(!running){ running = true; requestAnimationFrame(frame); } }


/* ---------- Modes ---------- */
function setBtn(){
  btn.hidden = noGL;
  btn.innerHTML = mode==="trail" ? `Skip the chase <span aria-hidden="true">→</span>` : `<span aria-hidden="true">←</span> ${window.innerWidth<520 ? "Scenic route" : "Return to the scenic route"}`;
}
function glFail(){
  if(noGL && mode==="all") return;
  noGL = true;
  const hero = document.querySelector(".allhero");
  if(hero && !hero.querySelector(".nogl")) hero.insertAdjacentHTML("afterbegin", `<p class="nogl">Your browser can't show the 3D walk, so here's everything on one page.</p>`);
  document.querySelectorAll('[data-act="trail"]').forEach(el=>{ el.hidden = true; });
  mode = null; setMode("all");
  try{ history.replaceState(null, "", "#everything"); }catch(e){}
}
function setMode(m){
  if(m==="trail" && noGL) m = "all";
  if(m===mode) return;
  if(mode==="trail") savedY = window.scrollY;
  mode = m;
  trailEl.hidden = m!=="trail";
  allEl.hidden = m!=="all";
  setBtn();
  if(m==="trail"){ layout(); window.scrollTo(0,savedY); update(); }
  else { window.scrollTo(0,0); }
}
function go(m){
  setMode(m);
  try{ location.hash = m==="all" ? "everything" : "scenic-route"; }catch(e){}
}
const fromHash = () => location.hash==="#everything" ? "all" : "trail";

btn.addEventListener("click", ()=> go(mode==="trail" ? "all" : "trail"));
document.addEventListener("click", e=>{
  const nv = e.target.closest("[data-nav]");
  if(nv){
    const k = nv.dataset.nav;
    if(k==="contact"){ openContact(); return; }
    if(mode==="trail") window.scrollTo({top: stopY(k==="about" ? 1 : N-1), behavior:scrollBehavior()});
    else if(k==="about") window.scrollTo({top:0, behavior:scrollBehavior()});
    else document.querySelector(".end").scrollIntoView({behavior:scrollBehavior()});
    return;
  }
  const b = e.target.closest("[data-act]"); if(!b) return;
  const a = b.dataset.act;
  if(a==="all") go("all");
  else if(a==="trail") go("trail");
  else if(a==="top") window.scrollTo({top:0,behavior:scrollBehavior()});
  else if(a==="contact") openContact();
  else if(a==="close") contactDlg.close();
});

/* ---------- Contact form ---------- */
const contactDlg=$("#contact"), cform=$("#cform"), cStatus=$("#cStatus"), cSend=$("#cSend");
function openContact(){
  if(contactDlg.open) return;
  cform.classList.remove("sent"); cStatus.textContent=""; cStatus.className="cstatus";
  if(contactDlg.showModal) contactDlg.showModal(); else contactDlg.setAttribute("open","");
  cform.elements.name.focus();
}
contactDlg.addEventListener("click", e=>{ if(e.target===contactDlg) contactDlg.close(); });
cform.addEventListener("submit", async e=>{
  e.preventDefault();
  const f = cform.elements;
  const say = (t,c) => { cStatus.textContent=t; cStatus.className="cstatus"+(c?" "+c:""); };
  if(f._honey.value){ cform.classList.add("sent"); say("Thanks! Your message is on its way.","ok"); return; }
  cSend.disabled = true; say("Sending...");
  try{
    const r = await fetch(SITE.contact.endpoint, {method:"POST", headers:{"Content-Type":"application/json","Accept":"application/json"},
      body: JSON.stringify({name:f.name.value.trim(), email:f.email.value.trim(), message:f.message.value.trim(), _subject:SITE.contact.subject, _template:"box", _captcha:"false"})});
    const j = await r.json().catch(()=>({}));
    if(!r.ok || String(j.success)!=="true") throw new Error(j.message||r.status);
    cform.reset(); cform.classList.add("sent");
    say("Thanks! Your message is on its way. I'll be in touch soon.","ok");
  }catch(err){
    console.warn("Contact form failed", err);
    say("Sorry, that didn't send. Please try again in a moment.","err");
  }finally{ cSend.disabled = false; }
});
window.addEventListener("hashchange", ()=> setMode(fromHash()));
window.addEventListener("scroll", onScroll, {passive:true});
let rz;
window.addEventListener("resize", ()=>{
  clearTimeout(rz);
  rz = setTimeout(()=>{
    setBtn();
    if(mode!=="trail") return;
    if(window.innerWidth===vw && Math.abs(window.innerHeight-H)<120) return;
    layout();
  }, 150);
});
document.addEventListener("focusin", e=>{
  const s = e.target.closest && e.target.closest(".stop"); if(!s || mode!=="trail") return;
  const y = stopY(+s.dataset.i);
  if(Math.abs(window.scrollY-y) > 60) window.scrollTo(0,y);
});

buildAll();
glCanvas.addEventListener("webglcontextlost", e=>{ e.preventDefault(); glFail(); });
if(noGL) glFail(); else setMode(fromHash());
if(document.fonts && document.fonts.ready) document.fonts.ready.then(()=>{ if(mode==="trail"){ measure(); update(); } });
</script>
</body>
